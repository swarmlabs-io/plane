name: Swarm Backend Build & Deploy

# Builds ONLY the custom backend image (apps/api) from swarm-prod and pushes it
# to GHCR, then deploys to the live server behind a manual approval gate.
# Frontend/proxy/live images are untouched — they keep coming from makeplane.

on:
  push:
    branches: [swarm-prod]
    paths:
      - "apps/api/**"
      - "deploy/swarm/**"
      - ".github/workflows/swarm-build-deploy.yml"
  workflow_dispatch:

concurrency:
  group: swarm-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/swarmlabs-io/plane-backend

jobs:
  build:
    name: Build & push backend image
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags for version derivation

      - id: meta
        name: Derive image tag
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          SHORT=$(git rev-parse --short HEAD)
          echo "tag=${BASE}-swarm.${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE }}:swarm-prod
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to live server
    needs: build
    runs-on: ubuntu-22.04
    environment: production # <-- manual approval gate (required reviewer)
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship deploy script & run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/swarm/deploy.sh "$SSH_USER@$SSH_HOST:/opt/plane-selfhost/plane-app/deploy.sh"
          # Authenticate the server to GHCR with this job's short-lived token (package stays private),
          # deploy, then log out — no long-lived registry credential is stored on the box.
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
             chmod +x /opt/plane-selfhost/plane-app/deploy.sh && \
             /opt/plane-selfhost/plane-app/deploy.sh '$TAG'; rc=\$?; docker logout ghcr.io >/dev/null 2>&1; exit \$rc"
